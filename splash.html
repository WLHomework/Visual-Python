<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Visual Python</title>
    <style>
      html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#263f3b}
      body{display:grid;place-items:center;color:#eef7f4;font-family:Inter,"Segoe UI",sans-serif;user-select:none}
      main{display:grid;justify-items:center;gap:14px}
      .mark{width:48px;height:48px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.25);border-radius:6px;background:#2f9e8f;color:#fff;font-size:16px;font-weight:700}
      strong{font-size:15px;font-weight:600;letter-spacing:0}
      small{color:#b9cfca;font-size:11px}
      .progress{width:132px;height:3px;overflow:hidden;background:rgba(255,255,255,.16)}
      .progress::after{content:"";display:block;width:48px;height:100%;background:#74d8ba;animation:slide .9s ease-in-out infinite alternate}
      @keyframes slide{from{transform:translateX(0)}to{transform:translateX(84px)}}
    </style>
  </head>
  <body>
    <main><div class="mark">Py</div><strong>Visual Python</strong><small>正在准备工作台</small><div class="progress"></div></main>
  </body>
</html>
