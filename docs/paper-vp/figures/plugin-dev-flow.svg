<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="520" viewBox="0 0 1250 520" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A6B78"/>
    </marker>
    <marker id="arrf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C0564B"/>
    </marker>
  </defs>
  <rect width="1250" height="520" fill="#FFFFFF"/>

  <!-- 主流程一行 7 步 -->
  <g>
    <rect x="42" y="120" width="150" height="96" rx="8" fill="#EEF6F3" stroke="#2F9E8F" stroke-width="1.5"/>
    <text x="117" y="156" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1F3A34">① 自然语言需求</text>
    <text x="117" y="178" font-size="11.5" text-anchor="middle" fill="#5B6E78">“帮我做一个</text>
    <text x="117" y="196" font-size="11.5" text-anchor="middle" fill="#5B6E78">×× 积木包”</text>

    <rect x="222" y="120" width="150" height="96" rx="8" fill="#FFFFFF" stroke="#B9CFC8" stroke-width="1.3"/>
    <text x="297" y="150" font-size="13.5" font-weight="600" text-anchor="middle" fill="#22333C">② 智能体规划</text>
    <text x="297" y="172" font-size="11.5" text-anchor="middle" fill="#6B7B84">读取插件契约与</text>
    <text x="297" y="190" font-size="11.5" text-anchor="middle" fill="#6B7B84">开发指南 · 确认目标工作台</text>

    <rect x="402" y="120" width="150" height="96" rx="8" fill="#FFFFFF" stroke="#B9CFC8" stroke-width="1.3"/>
    <text x="477" y="150" font-size="13.5" font-weight="600" text-anchor="middle" fill="#22333C">③ IR 编译</text>
    <text x="477" y="172" font-size="11.5" text-anchor="middle" fill="#6B7B84">插件中间表示编译为</text>
    <text x="477" y="190" font-size="11.5" text-anchor="middle" fill="#6B7B84">plugin.json 等源文件</text>

    <rect x="582" y="120" width="150" height="96" rx="8" fill="#FFFFFF" stroke="#B9CFC8" stroke-width="1.3"/>
    <text x="657" y="150" font-size="13.5" font-weight="600" text-anchor="middle" fill="#22333C">④ 静态验证</text>
    <text x="657" y="172" font-size="11.5" text-anchor="middle" fill="#6B7B84">积木定义 · 工具箱引用</text>
    <text x="657" y="190" font-size="11.5" text-anchor="middle" fill="#6B7B84">生成代码语法检查</text>

    <rect x="762" y="120" width="150" height="96" rx="8" fill="#FFFFFF" stroke="#B9CFC8" stroke-width="1.3"/>
    <text x="837" y="150" font-size="13.5" font-weight="600" text-anchor="middle" fill="#22333C">⑤ 宿主运行检查</text>
    <text x="837" y="172" font-size="11.5" text-anchor="middle" fill="#6B7B84">沙箱加载执行插件</text>
    <text x="837" y="190" font-size="11.5" text-anchor="middle" fill="#6B7B84">就绪（ready）方可安装</text>

    <rect x="942" y="120" width="130" height="96" rx="8" fill="#FFF9EC" stroke="#D8B65A" stroke-width="1.4"/>
    <text x="1007" y="150" font-size="13.5" font-weight="600" text-anchor="middle" fill="#6A5518">⑥ 用户确认</text>
    <text x="1007" y="172" font-size="11.5" text-anchor="middle" fill="#8A7434">安装前唯一授权点</text>
    <text x="1007" y="190" font-size="11.5" text-anchor="middle" fill="#8A7434">拒绝即终止</text>

    <rect x="1092" y="120" width="136" height="96" rx="8" fill="#EEF6F3" stroke="#2F9E8F" stroke-width="1.5"/>
    <text x="1160" y="150" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1F3A34">⑦ 新积木上线</text>
    <text x="1160" y="172" font-size="11.5" text-anchor="middle" fill="#5B6E78">进入工具箱，可用于</text>
    <text x="1160" y="190" font-size="11.5" text-anchor="middle" fill="#5B6E78">四类工作台工程</text>
  </g>
  <g stroke="#5A6B78" stroke-width="1.6">
    <line x1="192" y1="168" x2="216" y2="168" marker-end="url(#arrp)"/>
    <line x1="372" y1="168" x2="396" y2="168" marker-end="url(#arrp)"/>
    <line x1="552" y1="168" x2="576" y2="168" marker-end="url(#arrp)"/>
    <line x1="732" y1="168" x2="756" y2="168" marker-end="url(#arrp)"/>
    <line x1="912" y1="168" x2="936" y2="168" marker-end="url(#arrp)"/>
    <line x1="1072" y1="168" x2="1086" y2="168" marker-end="url(#arrp)"/>
  </g>

  <!-- 失败回流 -->
  <path d="M 837 216 L 837 300 L 477 300 L 477 220" fill="none" stroke="#C0564B" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#arrf)"/>
  <path d="M 1007 216 L 1007 300" fill="none" stroke="#C0564B" stroke-width="1.7" stroke-dasharray="7 5"/>
  <text x="660" y="288" font-size="12.5" fill="#A0453C">验证或运行检查未通过：按诊断定位问题，最小化修改草稿后重新验证（apply_plugin_plan）</text>

  <path d="M 1160 216 L 1160 380 L 477 380 L 477 220" fill="none" stroke="#C0564B" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#arrf)"/>
  <text x="700" y="404" font-size="12.5" fill="#A0453C">安装或运行失败：读取诊断（get_diagnostics）修复重装；原插件文件自动备份，可整体回滚</text>

  <!-- 底部说明带 -->
  <rect x="42" y="440" width="1186" height="48" rx="8" fill="#F7F9FA" stroke="#D5DEE2" stroke-width="1"/>
  <text x="635" y="469" font-size="13" text-anchor="middle" fill="#44565F">插件目标覆盖 Python（含 Manim）与 ESP32-S3 / ESP32-WROOM / ESP8266 四类工作台——平台能力可由智能体在运行期按需扩展</text>

  <text x="635" y="70" font-size="15" font-weight="600" text-anchor="middle" fill="#1F3A34">AI 插件开发：从自然语言需求到可安装积木包的自主闭环</text>
</svg>
