  <text x="900" y="58" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="31px" font-weight="700" fill="#183B56">生成式人工智能嵌入Visual Python的作用机制</text>
<text x="900" y="101" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20px" font-weight="400" fill="#526575">AI不以“一次生成完整作品”为终点，而是通过上下文理解、工具行动和结果验证支持学习者完成任务</text><rect x="70" y="180" width="355" height="650" rx="18" fill="#F5F8FB" stroke="#C8D7E4" stroke-width="2"/><text x="247" y="224" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="24px" font-weight="700" fill="#183B56">学习者输入与上下文</text><rect x="110" y="275" width="275" height="82" rx="12" fill="#FFFFFF" stroke="#C8D7E4" stroke-width="2"/><text x="247" y="307" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19px" font-weight="700" fill="#183B56">自然语言任务</text><text x="247" y="334" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16px" font-weight="400" fill="#536776">创建、修改或解释</text><rect x="110" y="395" width="275" height="82" rx="12" fill="#FFFFFF" stroke="#C8D7E4" stroke-width="2"/><text x="247" y="427" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19px" font-weight="700" fill="#183B56">当前场景</text><text x="247" y="454" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16px" font-weight="400" fill="#536776">场景文件与积木结构</text><rect x="110" y="515" width="275" height="82" rx="12" fill="#FFFFFF" stroke="#C8D7E4" stroke-width="2"/><text x="247" y="547" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19px" font-weight="700" fill="#183B56">当前代码</text><text x="247" y="574" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16px" font-weight="400" fill="#536776">完整代码与光标位置</text><rect x="110" y="635" width="275" height="82" rx="12" fill="#FFFFFF" stroke="#C8D7E4" stroke-width="2"/><text x="247" y="667" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19px" font-weight="700" fill="#183B56">运行问题</text><text x="247" y="694" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16px" font-weight="400" fill="#536776">报错、输出与差异</text><rect x="505" y="150" width="790" height="720" rx="18" fill="#FDFBF7" stroke="#E7C98F" stroke-width="3"/><text x="900" y="195" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="24px" font-weight="700" fill="#8A5200">智能体决策与行动</text><circle cx="575" cy="282" r="25" fill="#8A5200" stroke="none" stroke-width="2"/><text x="575" y="290" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18px" font-weight="700" fill="#FFFFFF">1</text><rect x="625" y="250" width="590" height="66" rx="12" fill="#FFF4DE" stroke="#E7C98F" stroke-width="2"/><text x="660" y="278" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19px" font-weight="700" fill="#6B4B19">理解</text><text x="750" y="278" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="17px" font-weight="400" fill="#536776">识别任务类型与目标范围</text><line x1="575" y1="308" x2="575" y2="332" stroke="#D39B3D" stroke-width="2" marker-end="url(#arrow)" /><circle cx="575" cy="382" r="25" fill="#8A5200" stroke="none" stroke-width="2"/><text x="575" y="390" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18px" font-weight="700" fill="#FFFFFF">2</text><rect x="625" y="350" width="590" height="66" rx="12" fill="#FFF4DE" stroke="#E7C98F" stroke-width="2"/><text x="660" y="378" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19px" font-weight="700" fill="#6B4B19">澄清</text><text x="750" y="378" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="17px" font-weight="400" fill="#536776">信息不足时提出必要问题</text><line x1="575" y1="408" x2="575" y2="432" stroke="#D39B3D" stroke-width="2" marker-end="url(#arrow)" /><circle cx="575" cy="482" r="25" fill="#8A5200" stroke="none" stroke-width="2"/><text x="575" y="490" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18px" font-weight="700" fill="#FFFFFF">3</text><rect x="625" y="450" width="590" height="66" rx="12" fill="#FFF4DE" stroke="#E7C98F" stroke-width="2"/><text x="660" y="478" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19px" font-weight="700" fill="#6B4B19">规划</text><text x="750" y="478" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="17px" font-weight="400" fill="#536776">选择最少且有效的操作</text><line x1="575" y1="508" x2="575" y2="532" stroke="#D39B3D" stroke-width="2" marker-end="url(#arrow)" /><circle cx="575" cy="582" r="25" fill="#8A5200" stroke="none" stroke-width="2"/><text x="575" y="590" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18px" font-weight="700" fill="#FFFFFF">4</text><rect x="625" y="550" width="590" height="66" rx="12" fill="#FFF4DE" stroke="#E7C98F" stroke-width="2"/><text x="660" y="578" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19px" font-weight="700" fill="#6B4B19">执行</text><text x="750" y="578" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="17px" font-weight="400" fill="#536776">创建或定点修改代码</text><line x1="575" y1="608" x2="575" y2="632" stroke="#D39B3D" stroke-width="2" marker-end="url(#arrow)" /><circle cx="575" cy="682" r="25" fill="#8A5200" stroke="none" stroke-width="2"/><text x="575" y="690" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18px" font-weight="700" fill="#FFFFFF">5</text><rect x="625" y="650" width="590" height="66" rx="12" fill="#E7F2E8" stroke="#9BC4A0" stroke-width="2"/><text x="660" y="678" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19px" font-weight="700" fill="#6B4B19">验证</text><text x="750" y="678" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="17px" font-weight="400" fill="#536776">检查语法、运行结果与错误</text><line x1="1215" y1="670" x2="1215" y2="750" stroke="#D39B3D" stroke-width="3" marker-end="url(#arrow)" /><line x1="1215" y1="770" x2="560" y2="770" stroke="#D39B3D" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="10 8"/><text x="900" y="805" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="17px" font-weight="400" fill="#6B4B19">若验证失败，回到理解或执行环节继续修正；若验证通过，结束本轮任务</text><rect x="1375" y="180" width="355" height="650" rx="18" fill="#F3F8F8" stroke="#A9D1D0" stroke-width="2"/><text x="1552" y="224" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="24px" font-weight="700" fill="#145A62">可见结果与学习证据</text><rect x="1415" y="275" width="275" height="82" rx="12" fill="#FFFFFF" stroke="#A9D1D0" stroke-width="2"/><text x="1552" y="307" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19px" font-weight="700" fill="#145A62">代码变化</text><text x="1552" y="334" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16px" font-weight="400" fill="#536776">增加、删除、修改位置可追踪</text><rect x="1415" y="395" width="275" height="82" rx="12" fill="#FFFFFF" stroke="#A9D1D0" stroke-width="2"/><text x="1552" y="427" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19px" font-weight="700" fill="#145A62">图形化结构</text><text x="1552" y="454" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16px" font-weight="400" fill="#536776">积木与代码保持对应</text><rect x="1415" y="515" width="275" height="82" rx="12" fill="#FFFFFF" stroke="#A9D1D0" stroke-width="2"/><text x="1552" y="547" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19px" font-weight="700" fill="#145A62">动态作品</text><text x="1552" y="574" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16px" font-weight="400" fill="#536776">运行结果可观察、可比较</text><rect x="1415" y="635" width="275" height="82" rx="12" fill="#FFFFFF" stroke="#A9D1D0" stroke-width="2"/><text x="1552" y="667" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19px" font-weight="700" fill="#145A62">过程说明</text><text x="1552" y="694" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16px" font-weight="400" fill="#536776">AI做了什么、为什么这样做</text><line x1="425" y1="505" x2="505" y2="505" stroke="#6C7B88" stroke-width="3" marker-end="url(#arrow)" /><line x1="1295" y1="505" x2="1375" y2="505" stroke="#6C7B88" stroke-width="3" marker-end="url(#arrow)" /><rect x="70" y="885" width="1660" height="72" rx="14" fill="#F7FAFD" stroke="#CBD8E4" stroke-width="2"/><text x="900" y="930" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19px" font-weight="600" fill="#334B5F">教育边界：学生负责问题判断与结果解释，教师负责任务设计与价值引导，AI负责过程支持而非替代学习责任</text></svg>