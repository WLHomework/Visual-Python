[package]
name = "visual-python"
version = "0.1.0"
description = "A visual programming workbench for Python and Manim"
authors = ["Visual Python Contributors"]
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "visual_python_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["image-png", "protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
url = "2.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
base64 = "0.22"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "sync"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
