[package]
name = "visual-python"
version = "0.1.0"
description = "A visual programming workbench for Python and Manim"
authors = ["Visual Python Contributors"]
edition = "2021"
rust-version = "1.95.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "visual_python_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
esptools = { version = "0.1.2", default-features = false, features = ["esptool"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["image-png", "protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
url = "2.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
base64 = "0.22"
sha2 = "0.10"
serialport = { version = "4.10.1", default-features = false }
tokio = { version = "1", features = ["macros", "sync", "time", "net", "rt"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
toml = "0.9"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
codex-app-server-client = { path = "../vendor/codex-rs/app-server-client" }
codex-app-server-protocol = { path = "../vendor/codex-rs/app-server-protocol" }
codex-arg0 = { path = "../vendor/codex-rs/arg0" }
codex-config = { path = "../vendor/codex-rs/config" }
codex-feedback = { path = "../vendor/codex-rs/feedback" }
codex-protocol = { path = "../vendor/codex-rs/protocol" }
codex-rollout = { path = "../vendor/codex-rs/rollout" }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

# Codex is consumed as a path dependency, so its root workspace patches are
# not inherited by this application. Keep the same fork revisions here.
[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

# The vendored codex workspace drags in hundreds of crates whose full debug
# info makes target/debug tens of GB. Keep line tables for readable backtraces
# while dropping variable-level DWARF/PDB data from dependencies only; the
# application crate itself keeps the default full debug info.
[profile.dev.package."*"]
debug = "line-tables-only"
